
name: Promote Tested App

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-tested-app.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy tested app to live root
        run: |
          cp test/index.html index.html
          cp test/styles.css styles.css
          cp test/app-core.js app-core.js
          cp test/app-tools.js app-tools.js
          cp test/app-enhancements.js app-enhancements.js
          cp test/timers.js timers.js
          cp test/sw.js sw.js
          cp test/icons/manifest.webmanifest manifest.webmanifest
          cp test/tbk-install-icon-192.png tbk-install-icon-192.png
          cp test/tbk-install-icon-512.png tbk-install-icon-512.png
          mkdir -p scripts
          cp test/icons/scripts/*.js scripts/

      - name: Save promoted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app-core.js app-tools.js app-enhancements.js timers.js sw.js manifest.webmanifest tbk-install-icon-192.png tbk-install-icon-512.png scripts/
          git commit -m "Promote tested My Recipe Book app"
          git push
